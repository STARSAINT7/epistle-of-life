name: Daily Devotional Auto-Publish

on:
  schedule:
    # Runs every day at 05:00 AM UTC (adjust time if needed)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows you to trigger a manual update anytime

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages Build
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
